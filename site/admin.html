<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>

<script>
const provider = new firebase.auth.GoogleAuthProvider();

document.getElementById("adminSignIn").addEventListener("click", () => {
  auth.signInWithPopup(provider).catch(e => alert(e.message));
});

document.getElementById("adminSignOut").addEventListener("click", () => {
  auth.signOut().then(() => {
    window.location.href = "index.html";
  });
});

auth.onAuthStateChanged((user) => {
  // Checks ADMIN_EMAILS defined in auth.js or defaults to authorized list
  const allowedAdmins = typeof ADMIN_EMAILS !== "undefined" ? ADMIN_EMAILS : ["busineswithpathak@gmail.com", "pathakanubhav74@gmail.com"];
  const isAdmin = user && user.email && allowedAdmins.includes(user.email);

  document.getElementById("gate").style.display = isAdmin ? "none" : "block";
  document.getElementById("adminApp").style.display = isAdmin ? "block" : "none";

  if (isAdmin) {
    loadProductsTable();
    loadCustomers();
    loadOrders();
  } else if (user) {
    alert("This account (" + user.email + ") is not authorized as an admin.");
    auth.signOut();
  }
});

// Tabs navigation
document.querySelectorAll(".admin-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".admin-tab").forEach((t) => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + tab.dataset.panel).classList.add("active");
  });
});

// Products Management
document.getElementById("addProductBtn").addEventListener("click", async () => {
  const name = document.getElementById("p_name").value.trim();
  const price = Number(document.getElementById("p_price").value);
  if (!name || !price) return alert("Name and price are required.");

  await db.collection("products").add({
    name,
    category: document.getElementById("p_category").value,
    price,
    mrp: Number(document.getElementById("p_mrp").value) || null,
    material: document.getElementById("p_material").value.trim(),
    height: document.getElementById("p_height").value.trim(),
    image: document.getElementById("p_image").value.trim(),
    desc: document.getElementById("p_desc").value.trim(),
    badge: document.getElementById("p_badge").value.trim(),
    inStock: document.getElementById("p_instock").value === "true",
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });

  ["p_name","p_price","p_mrp","p_material","p_height","p_image","p_desc","p_badge"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });

  loadProductsTable();
});

async function loadProductsTable() {
  const snap = await db.collection("products").orderBy("createdAt", "desc").get();
  document.getElementById("productsTable").innerHTML = snap.docs.map(d => {
    const p = d.data();
    return `<tr>
      <td>${p.name}</td><td>${p.category}</td><td>₹${(p.price||0).toLocaleString("en-IN")}</td>
      <td>${p.inStock ? "In stock" : "Hidden"}</td>
      <td><button class="btn btn-ghost" style="padding:6px 14px;font-size:12px" onclick="deleteProduct('${d.id}')">Delete</button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="5" style="color:var(--stone)">No products yet.</td></tr>`;
}

async function deleteProduct(id) {
  if (!confirm("Delete this product?")) return;
  await db.collection("products").doc(id).delete();
  loadProductsTable();
}

// Customers Management
async function loadCustomers() {
  const snap = await db.collection("users").orderBy("lastLogin", "desc").get();
  document.getElementById("customersTable").innerHTML = snap.docs.map(d => {
    const u = d.data();
    const last = u.lastLogin && u.lastLogin.toDate ? u.lastLogin.toDate().toLocaleString("en-IN") : "—";
    return `<tr><td>${u.name || "—"}</td><td>${u.email || "—"}</td><td>${last}</td></tr>`;
  }).join("") || `<tr><td colspan="3" style="color:var(--stone)">No logins yet.</td></tr>`;
}

// Orders Management
async function loadOrders() {
  const snap = await db.collection("orders").orderBy("createdAt", "desc").get();
  document.getElementById("ordersTable").innerHTML = snap.docs.map(d => {
    const o = d.data();
    const date = o.createdAt && o.createdAt.toDate ? o.createdAt.toDate().toLocaleString("en-IN") : "—";
    return `<tr><td>${d.id.slice(0,10)}…</td><td>${o.customerEmail || "—"}</td><td>₹${(o.amount||0).toLocaleString("en-IN")}</td><td>${o.status || "—"}</td><td>${date}</td></tr>`;
  }).join("") || `<tr><td colspan="5" style="color:var(--stone)">No orders yet.</td></tr>`;
}
</script>
